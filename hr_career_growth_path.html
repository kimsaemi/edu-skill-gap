<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR 성장 경로</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root{--ink:#172033;--muted:#64748b;--paper:#fff;--ground:#f3f6fa;--line:#dce3ed;--indigo:#4338ca;--indigo-soft:#eef2ff;--green:#087f5b;--green-soft:#ecfdf5;--amber:#a65b00;--amber-soft:#fff7e5;--radius:14px}*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 Pretendard,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:26px 24px 68px}.masthead{display:flex;justify-content:space-between;gap:24px;align-items:end;padding:25px 28px;background:#18234a;color:white;border-radius:20px}.masthead h1{margin:4px 0;font-size:28px;letter-spacing:-.04em}.masthead p{margin:0;color:#dbe4ff}.eyebrow{margin:0;color:#9fb3ff;font-size:13px;font-weight:750}.context{position:sticky;top:12px;z-index:3;margin:18px 0 14px;padding:14px 16px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(23,32,51,.08);display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin-bottom:4px}.field select,.field input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);font:inherit}.journey{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:18px 0 26px}.stage{border:0;background:transparent;text-align:left;padding:12px 14px;border-bottom:3px solid #cbd5e1;color:var(--muted);cursor:pointer;font:inherit}.stage b{display:block;color:inherit}.stage.active{color:var(--indigo);border-color:var(--indigo)}.stage.done{border-color:#34b78f}.pane{display:none}.pane.active{display:block}.lead{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:0 0 16px}.lead h2{margin:0;font-size:22px;letter-spacing:-.035em}.lead p{margin:3px 0 0;color:var(--muted)}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px}.card h3{font-size:16px;margin:0 0 12px}.task{width:100%;display:flex;gap:11px;align-items:flex-start;padding:13px;margin:7px 0;border:1px solid var(--line);border-radius:10px;background:white;text-align:left;cursor:pointer;font:inherit}.task.active{border-color:var(--indigo);background:var(--indigo-soft)}.task small,.muted{color:var(--muted)}.ksa{display:flex;gap:10px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #edf0f4;cursor:pointer}.ksa:last-child{border-bottom:0}.ksa input{accent-color:var(--indigo);margin-top:5px}.tag{display:inline-block;padding:2px 7px;border-radius:99px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:750}.tag.skill{background:#ecfdf5;color:#047857}.tag.attitude{background:#fff7e5;color:#9a5a08}.summary{background:#f8fafc;border-radius:10px;padding:15px}.number{font-size:32px;font-weight:850;letter-spacing:-.05em;color:var(--indigo)}.notice{padding:13px 15px;border-left:4px solid #45a481;background:var(--green-soft);color:#165b45;border-radius:7px}.button{border:0;border-radius:8px;padding:10px 14px;background:var(--indigo);color:white;font:inherit;font-weight:750;cursor:pointer}.button.secondary{background:white;color:var(--indigo);border:1px solid #c7d2fe}.button:focus-visible,.stage:focus-visible,.task:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.course{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #edf0f4}.course:last-child{border-bottom:0}.course h4{margin:4px 0;font-size:15px}.course p{margin:4px 0;color:var(--muted);font-size:13px}.course.selected{background:#f1fdf8;margin:0 -10px;padding:15px 10px}.score{display:grid;grid-template-columns:105px 1fr 45px;gap:10px;align-items:center;margin:11px 0;font-size:13px}.bar{height:10px;border-radius:99px;background:#e6eaf0;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#6366f1,#38bdf8);border-radius:99px}.roadmap{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.step{padding:15px;border:1px solid var(--line);border-radius:10px}.step b{display:block;margin-bottom:5px}.library-controls{display:flex;gap:10px;margin-bottom:12px}.library-controls input{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}.empty{padding:30px;color:var(--muted);text-align:center}.pill{padding:5px 9px;border-radius:99px;background:var(--amber-soft);color:var(--amber);font-size:12px;font-weight:750;white-space:nowrap}@media(max-width:760px){.wrap{padding:16px}.masthead,.lead{display:block}.masthead p{margin-top:8px}.context,.layout,.roadmap{grid-template-columns:1fr}.journey{grid-template-columns:1fr 1fr}.stage{font-size:13px}.course{display:block}.course .button{margin-top:8px}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="masthead"><div><p class="eyebrow">HR CAREER NAVIGATOR</p><h1>내 직무에서 다음 단계까지</h1><p>진단 결과가 교육 추천과 승진 준비도로 이어집니다.</p></div><div id="header-status" class="pill">진단을 시작해 보세요</div></header>
  <section class="context" aria-label="나의 성장 기준"><div class="field"><label for="job">현재 직무</label><select id="job"></select></div><div class="field"><label for="grade">현재 직급</label><select id="grade"></select></div><div class="field"><label for="task-select">관심 과업</label><select id="task-select"></select></div></section>
  <nav class="journey" aria-label="성장 단계"><button class="stage active" data-tab="diagnosis"><b>1. 현재 역량</b>내가 할 수 있는 일 확인</button><button class="stage" data-tab="learning"><b>2. 성장 계획</b>부족 역량을 교육으로 보완</button><button class="stage" data-tab="roadmap"><b>3. 다음 직급</b>준비도와 12주 계획</button><button class="stage" data-tab="library"><b>4. 교육 더 찾기</b>내 조건에 맞는 과정 탐색</button></nav>

  <section id="diagnosis" class="pane active"><div class="lead"><div><h2>현재 역량을 확인하세요</h2><p id="diagnosis-copy"></p></div></div><div class="layout"><div class="card"><h3>이 직무에서 중요하게 보는 과업</h3><div id="tasks"></div><h3 style="margin-top:22px">내가 이미 보유한 역량</h3><div id="ksa-list"></div></div><aside class="card"><h3>진단 요약</h3><div class="summary"><div class="number" id="owned-count">0 / 0</div><div class="muted">필수 역량 보유</div></div><div id="gap-note" class="notice" style="margin-top:14px"></div><button class="button" style="width:100%;margin-top:14px" data-go="learning">부족 역량으로 교육 추천 보기</button></aside></div></section>

  <section id="learning" class="pane"><div class="lead"><div><h2>부족한 역량에 맞춘 교육</h2><p id="learning-copy"></p></div><span id="course-count" class="pill"></span></div><div class="layout"><div class="card"><h3>추천 과정</h3><div id="courses"></div></div><aside class="card"><h3>선택한 교육의 예상 변화</h3><p class="muted">수강 예정 과정을 고르면 해당 역량 축이 바뀝니다.</p><div id="score-bars"></div><div class="notice" id="sim-note" style="margin-top:15px"></div><button class="button" style="width:100%;margin-top:14px" data-go="roadmap">다음 직급 준비도 보기</button></aside></div></section>

  <section id="roadmap" class="pane"><div class="lead"><div><h2 id="roadmap-title"></h2><p>진단과 선택한 교육을 반영한 개인 계획입니다.</p></div><div class="summary"><div class="number" id="readiness">0%</div><div class="muted">다음 직급 준비도</div></div></div><div class="notice" id="roadmap-note"></div><div class="card" style="margin-top:18px"><h3>이번 분기 12주 행동 계획</h3><div class="roadmap" id="steps"></div></div></section>

  <section id="library" class="pane"><div class="lead"><div><h2>내 조건에 맞는 교육 더 찾기</h2><p id="library-copy"></p></div></div><div class="card"><div class="library-controls"><input id="search" placeholder="교육명 또는 역량 검색"><button class="button secondary" id="toggle-library">추천 과정만 보기</button></div><div id="library-list"></div></div></section>
</main>
<script>
const jobs={
  planning:{name:'인사기획·인력계획',tasks:[{id:'plan',name:'연간 인력계획 수립',desc:'사업 계획에 맞춰 정원·현원을 설계합니다.',ksa:['law','strategy','data']},{id:'budget',name:'인건비 예산 편성',desc:'인건비를 추정하고 부서별로 배분합니다.',ksa:['data','finance','tool']}],ksa:{law:['K','노동법률 이해','근로기준법과 취업규칙의 기본 원칙'],strategy:['K','인사제도 이해','인력계획과 조직 운영의 원리'],data:['S','인력 데이터 분석','엑셀·지표로 인원과 비용을 해석'],finance:['S','인건비 모델링','가정에 따른 예산 변화를 계산'],tool:['S','HR 시스템 활용','ERP·스프레드시트로 데이터를 관리']},courses:[['excel','HR 데이터 분석과 피벗 실무','data',25,'인력 현황과 비용 데이터를 빠르게 해석합니다.'],['labor','인사담당자를 위한 노동법 기초','law',18,'규정 검토 시 필요한 법률 기초를 다집니다.'],['budget','인건비 예산 편성 실습','finance',22,'인건비 추정과 시나리오 계산을 연습합니다.'],['hris','HRIS·ERP 인사 모듈 실무','tool',16,'정원·현원 데이터를 시스템에서 관리합니다.']]},
  recruiting:{name:'채용·온보딩',tasks:[{id:'hire',name:'채용 프로세스 운영',desc:'채용 공고부터 면접·오퍼까지 관리합니다.',ksa:['law','interview','communication']},{id:'onboard',name:'온보딩 설계',desc:'입사 초기 적응 경험을 설계합니다.',ksa:['experience','communication','tool']}],ksa:{law:['K','채용 관련 법규','차별 금지와 개인정보 보호 원칙'],interview:['S','구조화 면접','일관된 기준으로 역량을 평가'],communication:['A','후보자·현업 조율','이해관계자와 명확하게 소통'],experience:['K','직원 경험 설계','입사자 여정을 설계하는 방법'],tool:['S','채용 시스템 활용','ATS와 협업 도구를 사용']},courses:[['interview','구조화 면접관 과정','interview',24,'면접 질문과 평가 기준을 설계합니다.'],['candidate','후보자 커뮤니케이션 실무','communication',18,'후보자와 현업 사이의 기대를 조율합니다.'],['privacy','채용 개인정보·노동법','law',16,'채용 단계의 법률 리스크를 줄입니다.'],['onboarding','온보딩 프로그램 디자인','experience',22,'입사 후 첫 90일 경험을 설계합니다.']]},
  rewards:{name:'보상·급여',tasks:[{id:'payroll',name:'급여 및 4대보험 관리',desc:'급여 계산과 신고 일정을 정확히 관리합니다.',ksa:['law','payroll','tool']},{id:'comp',name:'보상 체계 기획',desc:'직무·성과에 맞는 보상 기준을 설계합니다.',ksa:['compensation','data','communication']}],ksa:{law:['K','임금·사회보험 법규','급여와 보험의 법정 기준'],payroll:['S','급여 계산 실무','공제·정산·신고를 정확히 처리'],tool:['S','급여 시스템 활용','급여 솔루션과 엑셀을 활용'],compensation:['K','보상 체계 이해','직무·성과·시장 보상의 원리'],data:['S','보상 데이터 분석','급여 데이터를 비교·해석'],communication:['A','설명과 신뢰 형성','보상 기준을 명료하게 안내']},courses:[['payroll','급여·4대보험 실무','payroll',25,'월 마감과 신고 업무를 체계화합니다.'],['labor','임금과 근로시간 법률','law',18,'임금·근로시간 판단 기준을 익힙니다.'],['comp','보상 설계와 시장 데이터','compensation',22,'보상 체계의 설계 원리를 이해합니다.'],['excel','급여 데이터 분석 실무','data',20,'보상 데이터를 분석해 보고서로 만듭니다.']]}
};
const grades=['주임 (1~3년)','대리 (4~6년)','과장 (7~9년)','차장 (10~13년)','부장 (14년 이상)'];
const state={job:'planning',grade:grades[0],task:'plan',owned:new Set(['law']),courses:new Set(),libraryAll:false};
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function role(){return jobs[state.job]} function task(){return role().tasks.find(t=>t.id===state.task)} function required(){return task().ksa} function effective(){const x=new Set(state.owned);role().courses.forEach(c=>{if(state.courses.has(c[0]))x.add(c[2])});return x}
function renderSelects(){ $('#job').innerHTML=Object.entries(jobs).map(([id,j])=>`<option value="${id}">${j.name}</option>`).join('');$('#job').value=state.job;$('#grade').innerHTML=grades.map(g=>`<option>${g}</option>`).join('');$('#grade').value=state.grade;$('#task-select').innerHTML=role().tasks.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');$('#task-select').value=state.task;}
function renderDiagnosis(){const r=role(),t=task(),owned=state.owned;$('#diagnosis-copy').textContent=`${r.name}의 ‘${t.name}’을 기준으로 확인합니다.`;$('#tasks').innerHTML=r.tasks.map(x=>`<button class="task ${x.id===t.id?'active':''}" data-task="${x.id}"><span>◉</span><span><b>${x.name}</b><br><small>${x.desc}</small></span></button>`).join('');$('#ksa-list').innerHTML=required().map(id=>{const [type,name,desc]=r.ksa[id],cls=type==='K'?'':type==='S'?'skill':'attitude';return `<label class="ksa"><input type="checkbox" data-ksa="${id}" ${owned.has(id)?'checked':''}><span><span class="tag ${cls}">${type==='K'?'지식':type==='S'?'기술':'태도'}</span> <b>${name}</b><br><small>${desc}</small></span></label>`}).join(''); const count=required().filter(x=>owned.has(x)).length;$('#owned-count').textContent=`${count} / ${required().length}`;const gaps=required().filter(x=>!owned.has(x)).map(x=>r.ksa[x][1]);$('#gap-note').innerHTML=gaps.length?`<b>다음에 채울 역량</b><br>${gaps.join(', ')}`:`<b>이 과업의 필수 역량을 모두 체크했어요.</b><br>교육을 선택해 다음 직급 준비도를 높여 보세요.`;$('#header-status').textContent=`${r.name} · ${state.grade} · ${count}/${required().length} 보유`;}
function renderLearning(){const r=role(),missing=required().filter(x=>!effective().has(x)),recommend=r.courses.filter(c=>missing.includes(c[2])||state.courses.has(c[0]));$('#learning-copy').textContent=missing.length?`현재 부족한 ${missing.map(x=>r.ksa[x][1]).join(', ')}을 먼저 채웁니다.`:'현재 선택 과업의 부족 역량을 모두 보완했습니다.';$('#course-count').textContent=`수강 예정 ${state.courses.size}개`;$('#courses').innerHTML=recommend.length?recommend.map(c=>courseHtml(c,true)).join(''):`<div class="empty">지금 선택한 교육으로 필요한 역량을 모두 보완할 수 있어요.</div>`;renderScores();}
function courseHtml(c,action){const selected=state.courses.has(c[0]);return `<article class="course ${selected?'selected':''}"><div><span class="tag skill">${esc(role().ksa[c[2]][1])}</span><h4>${esc(c[1])}</h4><p>${esc(c[4])} · 예상 +${c[3]}점</p></div>${action?`<button class="button ${selected?'secondary':''}" data-course="${c[0]}">${selected?'수강 예정 취소':'수강 예정으로 담기'}</button>`:''}</article>`}
function scores(){const types=[['law','노동법률'],['strategy','인사제도'],['data','데이터 분석'],['communication','소통·조율'],['tool','전문 도구']];const base=state.grade.startsWith('주임')?35:state.grade.startsWith('대리')?50:65;const e=effective();return types.map(([id,label])=>{let v=base;required().forEach(k=>{if(k===id&&e.has(k))v+=25});role().courses.forEach(c=>{if(c[2]===id&&state.courses.has(c[0]))v+=c[3]});return [label,Math.min(100,v)]})}
function renderScores(){const vals=scores();$('#score-bars').innerHTML=vals.map(([l,v])=>`<div class="score"><span>${l}</span><div class="bar"><div class="fill" style="width:${v}%"></div></div><b>${v}</b></div>`).join('');const selected=[...state.courses].map(id=>role().courses.find(c=>c[0]===id)).filter(Boolean);$('#sim-note').innerHTML=selected.length?`<b>${selected.length}개 교육을 반영했습니다.</b><br>${selected.map(c=>role().ksa[c[2]][1]).join(', ')} 역량이 성장합니다.`:'수강 예정 교육을 골라 예상 변화를 확인하세요.'}
function renderRoadmap(){const r=role(),next=grades[Math.min(grades.indexOf(state.grade)+1,grades.length-1)],e=effective(),done=required().filter(k=>e.has(k)).length,courseBonus=Math.min(20,state.courses.size*10),readiness=Math.min(100,Math.round(done/required().length*65+courseBonus));$('#roadmap-title').textContent=`${state.grade}에서 ${next}로 가는 준비`;$('#readiness').textContent=`${readiness}%`;const missing=required().filter(k=>!e.has(k)).map(k=>r.ksa[k][1]);$('#roadmap-note').innerHTML=missing.length?`<b>아직 남은 조건:</b> ${missing.join(', ')}<br>수강 예정 과정을 완료하고, 실제 과업에서 결과물을 한 번 만들어 보세요.`:`<b>핵심 역량 조건을 모두 보완했습니다.</b><br>이제 실제 업무 결과물과 협업 경험을 쌓아 다음 직급을 준비하세요.`;$('#steps').innerHTML=[['1~4주','선택한 교육을 수강하고 실습 과제를 완료합니다.'],['5~8주',`‘${task().name}’ 관련 업무에서 작은 개선안을 만듭니다.`],['9~12주',`${next} 기준으로 결과물과 배운 점을 상사와 리뷰합니다.`]].map(x=>`<div class="step"><b>${x[0]}</b><span class="muted">${x[1]}</span></div>`).join('')}
function renderLibrary(){const r=role(),q=$('#search').value.toLowerCase(),recommended=new Set(required().filter(x=>!effective().has(x)));let list=r.courses.filter(c=>state.libraryAll||recommended.has(c[2])||state.courses.has(c[0]));if(q)list=list.filter(c=>(c[1]+r.ksa[c[2]][1]).toLowerCase().includes(q));$('#library-copy').textContent=state.libraryAll?`${r.name}에 관련된 전체 교육입니다.`:`현재 부족 역량에 맞춰 먼저 보여 드립니다.`;$('#toggle-library').textContent=state.libraryAll?'추천 과정만 보기':'직무 관련 전체 보기';$('#library-list').innerHTML=list.length?list.map(c=>courseHtml(c,true)).join(''):'<div class="empty">조건에 맞는 과정이 없습니다. 검색어를 바꾸거나 전체 보기를 선택하세요.</div>'}
function render(){renderSelects();renderDiagnosis();renderLearning();renderRoadmap();renderLibrary();}
function go(id){document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.stage').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.querySelectorAll('.stage').forEach((b,i)=>b.classList.toggle('done',i<['diagnosis','learning','roadmap','library'].indexOf(id)));window.scrollTo({top:0,behavior:'smooth'})}
$('#job').onchange=e=>{state.job=e.target.value;state.task=role().tasks[0].id;state.owned=new Set();state.courses=new Set();render()};$('#grade').onchange=e=>{state.grade=e.target.value;render()};$('#task-select').onchange=e=>{state.task=e.target.value;state.owned=new Set();state.courses=new Set();render()};document.addEventListener('click',e=>{const t=e.target.closest('[data-task],[data-course],[data-tab],[data-go]');if(!t)return;if(t.dataset.task){state.task=t.dataset.task;state.owned=new Set();state.courses=new Set();render()}if(t.dataset.course){state.courses.has(t.dataset.course)?state.courses.delete(t.dataset.course):state.courses.add(t.dataset.course);render()}if(t.dataset.tab)go(t.dataset.tab);if(t.dataset.go)go(t.dataset.go)});document.addEventListener('change',e=>{if(e.target.dataset.ksa){e.target.checked?state.owned.add(e.target.dataset.ksa):state.owned.delete(e.target.dataset.ksa);render()}});$('#search').oninput=renderLibrary;$('#toggle-library').onclick=()=>{state.libraryAll=!state.libraryAll;renderLibrary()};render();
</script>
</body>
</html>
