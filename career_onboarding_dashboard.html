      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

26#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;,\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\ud83d\uddd3\ufe0f 2. First 90 Days \uc2a4\ud504\ub9b0\ud2b8\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;,\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\ud83c\udf96\ufe0f 3. \uacf5\uc2dd \uc2b9\uae09(Lv1 \u27a1\ufe0f Lv2) \uccb4\ud06c\ub9ac\uc2a4\ud2b8\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;,\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\ud83d\udcca 4. \uc9c1\ubb34\uc5ed\ub7c9 \uc2a4\ud0ac \uac2d(Gap) \uc9c4\ub2e8\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;,\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\ud83d\udccb 5. 70:20:10 \uc2e4\ucc9c \ud50c\ub798\ub108\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;,\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\ud83d\udcc2 6. \uacf5\uacf5 \uad50\uc721\uacfc\uc815 \ud0d0\uc0c9\uae30\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-orientation='\u0026quot;horizontal\u0026quot;'\u003E\u003Cdiv data-kind='tab'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"5-standard-framework\"\u003E\ud83d\udccc \uc9c1\ubb34 \ud589\ub3d9 5\ub300 \ud45c\uc900 (Standard Framework)\u003C/h3\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth style=\"text-align: left;\"\u003E\ud45c\uc900 \ud56d\ubaa9\u003C/th\u003E\n\u003Cth style=\"text-align: left;\"\u003E\ud575\uc2ec \uc815\uc758 (Short \u0026amp; Clear)\u003C/th\u003E\n\u003Cth style=\"text-align: left;\"\u003E\ud589\ub3d9 \uc9c0\ud45c\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\u003Cstrong\u003E\u26a1 \ub9c8\uac10 \uc644\uacb0 (Execution)\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc57d\uc18d\ud55c \ub0a9\uae30 \uc5c4\uc218 \u0026amp; \ub05d\uae4c\uc9c0 \ucc45\uc784 \uc644\uacb0\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc9c0\uc5f0 \uc5c6\ub294 \ub9c8\uac10, \uc911\uac04\ubcf4\uace0 \uc2b5\uad00\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\u003Cstrong\u003E\ud83d\udd0d \uaf3c\uaf3c \ud488\uc9c8 (Quality)\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc624\ud0c0\u00b7\uc218\uce58 \uc624\ucc28 \uc5c6\ub294 \ucca0\uc800\ud55c \uc790\uccb4 \uac80\uc218\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc790\uccb4 \uccb4\ud06c\ub9ac\uc2a4\ud2b8 \ud655\uc778, \ubc18\ub824\uc728 0%\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\u003Cstrong\u003E\ud83e\udd1d \uc18c\ud1b5 \ud611\uc5c5 (Collaboration)\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uacbd\uccad\uacfc \ubc30\ub824\ub85c \uc2dc\ub108\uc9c0\ub97c \ub0b4\ub294 \ud300\uc6cc\ud06c\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uc0c1\ub300 \ub9e5\ub77d \ud30c\uc545, \uc9c8\ubb38\uacfc \uacf5\uc720\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\u003Cstrong\u003E\ud83e\udded \uc790\uae30 \uc8fc\ub3c4 (Autonomy)\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\uac04\uc12d \uc5c6\uc774 \uc2a4\uc2a4\ub85c \ub300\uc548 \ubaa8\uc0c9 (Min. Supervision)\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E30\ubd84 \uace0\ubbfc \ud6c4 \ub300\uc548\uc744 \ub4e4\uace0 \uc9c8\ubb38\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\u003Cstrong\u003E\ud83d\udcd0 \uccb4\uacc4 \uc815\ub9ac (Organization)\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\ud30c\uc77c\uacfc \uc11c\uc2dd\uc744 \uc7ac\uc0ac\uc6a9 \uac00\ub2a5\ud55c \ud15c\ud50c\ub9bf\ud654\u003C/td\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\ud3f4\ub354 \uc815\ub9ac, \ubb38\uc11c \uc11c\uc2dd \ud45c\uc900\ud654\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='bkHC-0' random-id='cb5c7c79-f977-0864-dcb4-94e44b4a00e5'\u003E\u003Cmarimo-multiselect data-initial-value='[\u0026quot;\u26a1 \ub9c8\uac10 \uc644\uacb0 (\ub0a9\uae30 \uc900\uc218\u00b7\ub05d\uae4c\uc9c0 \ucc45\uc784)\u0026quot;,\u0026quot;\ud83d\udd0d \uaf3c\uaf3c \ud488\uc9c8 (\uc624\ucc28 \uc81c\ub85c\u00b7\ucca0\uc800 \uac80\uc218)\u0026quot;]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\ud83d\udccc \u0026#92;u003cstrong\u0026#92;u003e\ub0b4\uac00 \uc9c0\ud5a5\ud558\ub294 \uc5c5\ubb34 \ud45c\uc900 (\uc6d0\ud558\ub294 \ud56d\ubaa9\uc744 \ubcf5\uc218 \uc120\ud0dd\ud558\uc138\uc694):\u0026#92;u003c/strong\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-options='[\u0026quot;\u26a1 \ub9c8\uac10 \uc644\uacb0 (\ub0a9\uae30 \uc900\uc218\u00b7\ub05d\uae4c\uc9c0 \ucc45\uc784)\u0026quot;,\u0026quot;\ud83d\udd0d \uaf3c\uaf3c \ud488\uc9c8 (\uc624\ucc28 \uc81c\ub85c\u00b7\ucca0\uc800 \uac80\uc218)\u0026quot;,\u0026quot;\ud83e\udd1d \uc18c\ud1b5 \ud611\uc5c5 (\uacbd\uccad \ubc30\ub824\u00b7\ud300\uc6cc\ud06c)\u0026quot;,\u0026quot;\ud83e\udded \uc790\uae30 \uc8fc\ub3c4 (\uac04\uc12d \uc5c6\uc774 \ub300\uc548 \ucc3e\uae30)\u0026quot;,\u0026quot;\ud83d\udcd0 \uccb4\uacc4 \uc815\ub9ac (\uc11c\uc2dd \ud15c\ud50c\ub9bf\u00b7\uc790\ub8cc \uc815\ub9ac)\u0026quot;]' data-full-width='false' data-disabled='false'\u003E\u003C/marimo-multiselect\u003E\u003C/marimo-ui-element\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\u003C/span\u003E\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cdiv style=\u0026#x27;display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem\u0026#x27;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003ch3 id=\u0026#92;\u0026quot;the-meticulous-finisher\u0026#92;\u0026quot;\u0026#92;u003e\ud83c\udf89 \ud569\uc131\ub41c \ub098\uc758 \ud398\ub974\uc18c\ub098: \u0026#92;u003cstrong\u0026#92;u003e\ud83d\udee1\ufe0f \uc2e0\ub8b0\uc758 \ubb34\uacb0\uc810 \uc2e4\ud589\uac00 (The Meticulous Finisher)\u0026#92;u003c/strong\u0026#92;u003e\u0026#92;u003c/h3\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cblockquote\u0026#92;u003e\u0026#92;n\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cem\u0026#92;u003e\u0026#x27;\uc57d\uc18d\ud55c \uae30\ud55c \ub0b4 \uc644\uacb0\u0026#x27;\uacfc(\uc640) \u0026#x27;\uc624\ucc28 \uc5c6\ub294 \ucca0\uc800\ud55c \ud488\uc9c8 \uac80\uc99d\u0026#x27;\uc758 \uc2dc\ub108\uc9c0\ub97c \ub0b4\ub294 \ubcf5\ud569\ud615 \uc778\uc7ac\u0026#92;u003c/em\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;n\u0026#92;u003c/blockquote\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003e\ud83c\udff7\ufe0f \ud575\uc2ec \uac15\uc810 \ud0dc\uadf8\u0026#92;u003c/strong\u0026#92;u003e: \u0026#92;u003ccode\u0026#92;u003e#\ub0a9\uae30\uc5c4\uc218\u0026#92;u003c/code\u0026#92;u003e \u0026#92;u003ccode\u0026#92;u003e#\uc624\ucc28\uc81c\ub85c\u0026#92;u003c/code\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003e\ud83d\udca1 \ud575\uc2ec \uc2e4\ucc9c \uac00\uc774\ub4dc\u0026#92;u003c/strong\u0026#92;u003e:\u0026#92;u003c/span\u0026#92;u003e\u0026#92;n\u0026#92;u003cul\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003e\u26a1 \ub9c8\uac10 \uc644\uacb0\u0026#92;u003c/strong\u0026#92;u003e: 50% \uc2dc\uc810 \ucd08\uc548 \uacf5\uc720(Rough Draft)\ub85c \ub9c8\uac10 \ub9ac\uc2a4\ud06c \uc81c\uac70\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003e\ud83d\udd0d \uaf3c\uaf3c \ud488\uc9c8\u0026#92;u003c/strong\u0026#92;u003e: \uc81c\ucd9c \uc804 \u0026#x27;\uc678\uad00-\uc22b\uc790-\uc218\uc2e0\uc790\u0026#x27; 3\ub2e8\uacc4 \uc790\uccb4 \uac80\uc218 \ub8e8\ud2f4\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003c/ul\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003e\ud83d\udcda \uc5f0\uacc4 \ucd94\ucc9c \uc9c1\ubb34 \uae30\ubcf8\uae30\u0026#92;u003c/strong\u0026#92;u003e: ETH-01 \uc131\uc2e4\u00b7\ucc45\uc784\uac10, EXE-02 \uc2e4\ud589\u00b7\uc644\uacb0\uc131, PRO-02 \uc9c1\ubb34\ub3c4\uad6c, COM-01 \uba85\ud655\ud55c \ubb38\uc11c\uc791\uc131\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/div\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;success\u0026quot;'\u003E\u003C/marimo-callout-output\u003E\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003ch4 id=\u0026#92;\u0026quot;11-1-identity-pledge\u0026#92;\u0026quot;\u0026#92;u003e\ud83d\udde3\ufe0f \u0026#92;u003cstrong\u0026#92;u003e\uc0ac\uc218/\ud300\uc7a5 1:1 \uc628\ubcf4\ub529 \uba74\ub2f4\uc6a9 1\uc904 \uc120\uc5b8\ubb38 (Identity Pledge)\u0026#92;u003c/strong\u0026#92;u003e\u0026#92;u003c/h4\u0026#92;u003e\u0026#92;n\u0026#92;u003cblockquote\u0026#92;u003e\u0026#92;n\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cem\u0026#92;u003e\u0026#92;\u0026quot;\ud300\uc7a5\ub2d8, \uc800\ub294 \uc6b0\ub9ac \ud300\uc5d0\uc11c \u0026#92;u003c/em\u0026#92;u003e\u0026#92;u003cem\u0026#92;u003e\u0026#x27;\uc57d\uc18d\ud55c \uae30\ud55c \ub0b4 \uc644\uacb0\u0026#x27;\u0026#92;u003c/em\u0026#92;u003e\u0026#92;u003cem\u0026#92;u003e\uacfc(\uc640) \u0026#92;u003c/em\u0026#92;u003e\u0026#92;u003cem\u0026#92;u003e\u0026#x27;\uc624\ucc28 \uc5c6\ub294 \ucca0\uc800\ud55c \ud488\uc9c8 \uac80\uc99d\u0026#x27;\u0026#92;u003c/em\u0026#92;u003e\u0026#92;u003cem\u0026#92;u003e\uc744(\ub97c) \uacb8\ube44\ud55c \ub4e0\ub4e0\ud55c \ub3d9\ub8cc\uac00 \ub418\uaca0\uc2b5\ub2c8\ub2e4.\u0026#92;\u0026quot;\u0026#92;u003c/em\u0026#92;u003e\u0026#92;n\u0026#92;u003cem\u0026#92;u003e(\uc704 \ubb38\uc7a5\uc744 \ubcf5\uc0ac\ud558\uc5ec 1:1 \uc628\ubcf4\ub529 \uba74\ub2f4 \uc2dc \ub098\uc758 \uc5c5\ubb34 \uc9c0\ud5a5\uc810\uc73c\ub85c \uacf5\uc720\ud574\ubcf4\uc138\uc694)\u0026#92;u003c/em\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;n\u0026#92;u003c/blockquote\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;neutral\u0026quot;'\u003E\u003C/marimo-callout-output\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\u003C/span\u003E\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cdiv style=\u0026#x27;display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem\u0026#x27;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003ch3 id=\u0026#92;\u0026quot;action-plan\u0026#92;\u0026quot;\u0026#92;u003e\ud83d\ude80 \u0026#92;u003cstrong\u0026#92;u003e\uadf8\ub798\uc11c \ub0b4\uc77c\ubd80\ud130 \ub2f9\uc7a5 \ubb34\uc5c7\uc744 \ud574\uc57c \ud558\ub098\uc694? (Action Plan)\u0026#92;u003c/strong\u0026#92;u003e\u0026#92;u003c/h3\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cdiv class=\u0026#92;\u0026quot;language-scdoc highlight\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cpre\u0026#92;u003e\u0026#92;u003cspan\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003ccode\u0026#92;u003e            \ud398\ub974\uc18c\ub098\uc640 \ud45c\uc900\uc744 \ud655\uc778\ud558\uc168\ub2e4\uba74, **\ub0b4\uc77c\ubd80\ud130 \ub2e4\uc74c 3\uac00\uc9c0\ub97c \uc21c\uc11c\ub300\ub85c \uc2e4\ucc9c**\ud558\uc138\uc694:\u0026#92;n\u0026#92;n            1. **\ud83d\udde3\ufe0f Step 1. \uc120\uc5b8\ud558\uae30 (\ub0b4\uc77c \uccab 1:1 \ud2f0\ud0c0\uc784/\uba74\ub2f4)**\u0026#92;n\u0026#92;n                \u0026#92;u003cspan class=\u0026#92;\u0026quot;k\u0026#92;\u0026quot;\u0026#92;u003e-\u0026#92;u003c/span\u0026#92;u003e \uc0ac\uc218\ub098 \ud300\uc7a5\ub2d8\uaed8 \uc704\uc758 **`1\uc904 \uc120\uc5b8\ubb38`**\uc744 \uc804\ub2ec\ud558\uc138\uc694.\u0026#92;n\u0026#92;n                \u0026#92;u003cspan class=\u0026#92;\u0026quot;k\u0026#92;\u0026quot;\u0026#92;u003e-\u0026#92;u003c/span\u0026#92;u003e *\u0026#92;\u0026quot;\uc120\ubc30\ub2d8, \uc800\ub294 \uc774\ubc88 \uc628\ubcf4\ub529 \ub3d9\uc548 \ud2b9\ud788 **\ub9c8\uac10 \uc644\uacb0, \uaf3c\uaf3c \ud488\uc9c8**\uc5d0 \uc9d1\uc911\ud574\uc11c 1\uc778\ubd84\uc744 \ud574\ub0b4\uace0 \uc2f6\uc2b5\ub2c8\ub2e4.\u0026#92;\u0026quot;*\ub77c\uace0 \ub9d0\ud574\ub450\uba74, \uc120\ubc30\uac00 \uadf8 \uae30\uc900\uc5d0 \ub9de\ucd94\uc5b4 \ub9de\ucda4\ud615 \ud53c\ub4dc\ubc31\uc744 \uc90d\ub2c8\ub2e4.\u0026#92;n\u0026#92;n            2. **\u2699\ufe0f Step 2. \ub370\uc77c\ub9ac \ub8e8\ud2f4 \uc7a5\uce58 \uac78\uae30 (\uc624\ub298 \ud1f4\uadfc \uc804)**\u0026#92;n\u0026#92;n                \u0026#92;u003cspan class=\u0026#92;\u0026quot;k\u0026#92;\u0026quot;\u0026#92;u003e-\u0026#92;u003c/span\u0026#92;u003e \ub0b4 \ubaa8\ub2c8\ud130 \uba54\ubaa8\uc9c0\ub098 \uce98\ub9b0\ub354\uc5d0 \ub0b4 \ud398\ub974\uc18c\ub098 \ub9de\ucda4 **\u0026#x27;1\uc77c 1\uaddc\uce59\u0026#x27;**\uc744 \uac78\uc5b4\ub450\uc138\uc694:\u0026#92;n\u0026#92;u003c/code\u0026#92;u003e\u0026#92;u003c/pre\u0026#92;u003e\u0026#92;u003c/div\u0026#92;u003e\u0026#92;n\u0026#92;u003cul\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003e\u26a1 \ub9c8\uac10 \uc644\uacb0\u0026#92;u003c/strong\u0026#92;u003e: 50% \uc2dc\uc810 \ucd08\uc548 \uacf5\uc720(Rough Draft)\ub85c \ub9c8\uac10 \ub9ac\uc2a4\ud06c \uc81c\uac70\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003e\u0026#92;n\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003e\ud83d\udd0d \uaf3c\uaf3c \ud488\uc9c8\u0026#92;u003c/strong\u0026#92;u003e: \uc81c\ucd9c \uc804 \u0026#x27;\uc678\uad00-\uc22b\uc790-\uc218\uc2e0\uc790\u0026#x27; 3\ub2e8\uacc4 \uc790\uccb4 \uac80\uc218 \ub8e8\ud2f4\u0026#92;u003c/span\u0026#92;u003e\u0026#92;n\u0026#92;u003cdiv class=\u0026#92;\u0026quot;language-scdoc highlight\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cpre\u0026#92;u003e\u0026#92;u003cspan\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003ccode\u0026#92;u003e        3. **\ud83d\uddfa\ufe0f Step 3. \uc2b9\uae09 \ub85c\ub4dc\ub9f5\uacfc \uc5f0\uacb0\ud558\uae30 (\uc9c0\uae08 \ubc14\ub85c)**\u0026#92;n\u0026#92;n            \u0026#92;u003cspan class=\u0026#92;\u0026quot;k\u0026#92;\u0026quot;\u0026#92;u003e-\u0026#92;u003c/span\u0026#92;u003e \uc0c1\ub2e8 **`\ud83d\uddd3\ufe0f 2. First 90 Days \uc2a4\ud504\ub9b0\ud2b8`** \ud0ed\uc744 \ud074\ub9ad\ud558\uc5ec \uc774\ubc88 \ub2ec(Day 1~30) \ub2ec\uc131\ud574\uc57c \ud560 \uad6c\uccb4\uc801 \ub9c8\uc77c\uc2a4\ud1a4\uc744 \ud655\uc778\ud558\uc138\uc694.\u0026#92;n\u0026#92;n            \u0026#92;u003cspan class=\u0026#92;\u0026quot;k\u0026#92;\u0026quot;\u0026#92;u003e-\u0026#92;u003c/span\u0026#92;u003e \uc0c1\ub2e8 **`\ud83c\udf96\ufe0f 3. \uacf5\uc2dd \uc2b9\uae09 \uccb4\ud06c\ub9ac\uc2a4\ud2b8`** \ud0ed\uc5d0\uc11c \ub3c5\ub9bd \uc2e4\ubb34\uc790(Lv2) \uc2b9\uae09\uc744 \uc704\ud574 \ub0b4\uac00 \ucc44\uc6cc\uc57c \ud560 5\ub300 \ud544\uc218 \uc694\uac74\uc744 \uc810\uac80\ud558\uc138\uc694!\u0026#92;n\u0026#92;u003c/code\u0026#92;u003e\u0026#92;u003c/pre\u0026#92;u003e\u0026#92;u003c/div\u0026#92;u003e\u0026#92;n\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003c/ul\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003cmarimo-accordion data-labels=\u0026#x27;[\u0026amp;quot;\u0026amp;#92;u003cspan class=\u0026amp;#92;\u0026amp;quot;markdown prose dark:prose-invert contents\u0026amp;#92;\u0026amp;quot;\u0026amp;#92;u003e\u0026amp;#92;u003cspan class=\u0026amp;#92;\u0026amp;quot;paragraph\u0026amp;#92;\u0026amp;quot;\u0026amp;#92;u003e\ud83d\udcc4 \ub098\ub9cc\uc758 \uc628\ubcf4\ub529 1\uc7a5 \uc2e4\ud589 \uce74\ub4dc (\uc0ac\uc218 \uba74\ub2f4/\ubcf5\uc0ac\uc6a9 \ud14d\uc2a4\ud2b8 \uc5f4\uae30)\u0026amp;#92;u003c/span\u0026amp;#92;u003e\u0026amp;#92;u003c/span\u0026amp;#92;u003e\u0026amp;quot;]\u0026#x27; data-multiple=\u0026#x27;false\u0026#x27; data-expanded=\u0026#x27;[]\u0026#x27;\u0026#92;u003e\u0026#92;u003cdiv\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cdiv class=\u0026#92;\u0026quot;language-text codehilite\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cpre\u0026#92;u003e\u0026#92;u003cspan\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003ccode\u0026#92;u003e============================================================\u0026#92;n[\ub098\uc758 \uc628\ubcf4\ub529 1\uc7a5 \uc2e4\ud589 \uce74\ub4dc (My Onboarding Action Sheet)]\u0026#92;n\u0026#92;n- \ub300\uc0c1 \uc9c1\ubb34: \uc778\uc0ac(HR)\u0026#92;n\u0026#92;n- \uc9c0\ud5a5 \uce90\ub9ad\ud130: \ud83d\udee1\ufe0f \uc2e0\ub8b0\uc758 \ubb34\uacb0\uc810 \uc2e4\ud589\uac00 (The Meticulous Finisher)\u0026#92;n\u0026#92;n- \ud575\uc2ec \ud45c\uc900: \ub9c8\uac10 \uc644\uacb0, \uaf3c\uaf3c \ud488\uc9c8\u0026#92;n------------------------------------------------------------\u0026#92;n\u0026#92;n1. [\ub0b4\uc77c \ucd9c\uadfc \uc2dc \uc120\uc5b8\ud560 \ud55c \uc904 (\uc0ac\uc218/\ud300\uc7a5 \uacf5\uc720\uc6a9)]\u0026#92;n   \u0026#92;\u0026quot;\ud300\uc7a5\ub2d8, \uc800\ub294 \uc6b0\ub9ac \ud300\uc5d0\uc11c **\u0026#x27;\uc57d\uc18d\ud55c \uae30\ud55c \ub0b4 \uc644\uacb0\u0026#x27;**\uacfc(\uc640) **\u0026#x27;\uc624\ucc28 \uc5c6\ub294 \ucca0\uc800\ud55c \ud488\uc9c8 \uac80\uc99d\u0026#x27;**\uc744(\ub97c) \uacb8\ube44\ud55c \ub4e0\ub4e0\ud55c \ub3d9\ub8cc\uac00 \ub418\uaca0\uc2b5\ub2c8\ub2e4.\u0026#92;\u0026quot;\u0026#92;n\u0026#92;n2. [\uc774\ubc88 \uc8fc \ub0b4\uac00 \uc0ac\uc218\uc5d0\uac8c \ubb3c\uc5b4\ubcfc \ud575\uc2ec \uc9c8\ubb38 1\uac00\uc9c0]\u0026#92;n   \u0026#92;\u0026quot;\uc120\ubc30\ub2d8, \uc800\ud76c \ud300\uc5d0\uc11c \uc8fc\ub2c8\uc5b4\uac00 \uac00\uc7a5 \ube48\ubc88\ud558\uac8c \uc800\uc9c0\ub974\ub294 \uc2e4\uc218\ub294 \ubb34\uc5c7\uc774\uba70,\u0026#92;n    \uc81c\uac00 \uc774\ub97c \uc0ac\uc804\uc5d0 \ubc29\uc9c0\ud558\ub824\uba74 \uc5b4\ub5a4 \uac80\uc218 \ub8e8\ud2f4\uc744 \ucc59\uaca8\uc57c \ud560\uae4c\uc694?\u0026#92;\u0026quot;\u0026#92;n\u0026#92;n3. [\uc774\ubc88 \ub2ec(Day 30)\uae4c\uc9c0 \ubc18\ub4dc\uc2dc \ub2ec\uc131\ud560 \uc2b9\uae09 \uc790\uaca9 \uc694\uac74]\u0026#92;n\u0026#92;n    - \ud300 \ud45c\uc900 \ub3c4\uad6c(ERP/\uc0ac\ubb34\uc11c\uc2dd) \ub2e8\ub3c5 \uc870\uc791 \uc219\ub2ec (\uc0ac\uc218 \uac1c\uc785 \ucd5c\uc18c\ud654)\u0026#92;n\u0026#92;n    - \ub9c8\uac10 \uc77c\uc815 \uc9c0\uc5f0 0\uac74 \ubc0f \uacb0\ud568 \ubc18\ub824\uc728 \uc81c\ub85c \ub2ec\uc131\u0026#92;n============================================================\u0026#92;n\u0026#92;u003c/code\u0026#92;u003e\u0026#92;u003c/pre\u0026#92;u003e\u0026#92;u003c/div\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/div\u0026#92;u003e\u0026#92;u003c/marimo-accordion\u0026#92;u003e\u0026#92;u003c/div\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;info\u0026quot;'\u003E\u003C/marimo-callout-output\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv data-kind='tab'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"hr-first-90-days\"\u003E\ud83d\uddd3\ufe0f \uc778\uc0ac(HR) First 90 Days \uc628\ubcf4\ub529 \uc2a4\ud504\ub9b0\ud2b8 \ub85c\ub4dc\ub9f5\u003C/h2\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003E\uc2e0\uaddc \uc785\uc0ac\uc790\uac00 3\uac1c\uc6d4 \uc548\uc5d0 \ubc29\ud669\ud558\uc9c0 \uc54a\uace0 \ub3c5\ub9bd\uc801\uc778 1\uc778\ubd84(L2) \uc2e4\ubb34\uc790\ub85c \uc790\ub9ac \uc7a1\uae30 \uc704\ud55c \ud0c0\uc784\ub77c\uc778\uc785\ub2c8\ub2e4.\u003C/span\u003E\n\u003C/blockquote\u003E\u003C/span\u003E\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003ch3 id=\u0026#92;\u0026quot;lv1-4-core-baseline\u0026#92;\u0026quot;\u0026#92;u003e\ud83e\udded \u0026#92;u003cstrong\u0026#92;u003e\uc870\uc9c1\uc774 Lv1\uc5d0\uac8c \uae30\ub300\ud558\ub294 4\ub300 \uae30\ubcf8 \ud589\ub3d9 (Core Baseline)\u0026#92;u003c/strong\u0026#92;u003e\u0026#92;u003c/h3\u0026#92;u003e\u0026#92;n\u0026#92;u003col\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003e\uaddc\ubc94\uacfc \uc57d\uc18d (Rule)\u0026#92;u003c/strong\u0026#92;u003e: \uadfc\ud0dc, \uae30\ubcf8 \uc0ac\uaddc, \uac1c\uc778\uc815\ubcf4 \ubcf4\uc548, \uc77c\uc815 \uc57d\uc18d \uc5c4\uc218 (\u0026#92;u003ccode\u0026#92;u003eVAL-01\u0026#92;u003c/code\u0026#92;u003e)\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003e\uc18c\ud1b5\uacfc \uc9c8\ubb38 (Communication)\u0026#92;u003c/strong\u0026#92;u003e: 30\ubd84 \ub8f0(\ud63c\uc790 30\ubd84 \uace0\ubbfc \ud6c4 \uc9c8\ubb38), 50% \uc2dc\uc810 \uc911\uac04\ubcf4\uace0 \uc2b5\uad00 (\u0026#92;u003ccode\u0026#92;u003eCOL-01\u0026#92;u003c/code\u0026#92;u003e)\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003e\uc0ac\ub0b4 \ub3c4\uad6c \uc775\ud788\uae30 (Tools)\u0026#92;u003c/strong\u0026#92;u003e: \uba54\uc2e0\uc800, \ubb38\uc11c \ub3c4\uad6c, \uc9c1\ubb34 \ud45c\uc900 \uc2dc\uc2a4\ud15c(ERP/\uc5d1\uc140) \uae30\ubcf8 \uc870\uc791 (\u0026#92;u003ccode\u0026#92;u003ePRO-02\u0026#92;u003c/code\u0026#92;u003e)\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003e\u0026#92;u003cstrong\u0026#92;u003e\uc644\uacb0 \uc2b5\uad00 (Finishing)\u0026#92;u003c/strong\u0026#92;u003e: \ub9c8\uac10 \uae30\ud55c \uc900\uc218, \uc790\uccb4 \uac80\uc218 \uccb4\ud06c\ub9ac\uc2a4\ud2b8 \ud655\uc778 \ud6c4 \uc81c\ucd9c (\u0026#92;u003ccode\u0026#92;u003eEXE-02\u0026#92;u003c/code\u0026#92;u003e)\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003c/ol\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;info\u0026quot;'\u003E\u003C/marimo-callout-output\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"_1\"\u003E\u23f1\ufe0f \u003Cstrong\u003E\uc6d4\ubcc4 \ub2e8\uacc4\ubcc4 \ub2ec\uc131 \ub9c8\uc77c\uc2a4\ud1a4\u003C/strong\u003E\u003C/h3\u003E\u003C/span\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 2rem'\u003E\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003ch4 id=\u0026#92;\u0026quot;day-1-30\u0026#92;\u0026quot;\u0026#92;u003e\ud83d\udea9 \u0026#92;u003cstrong\u0026#92;u003eDay 1 ~ 30: \uc801\uc751
